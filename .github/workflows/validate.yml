name: Katalog prüfen
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/validate.ts --report
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: build/report.json
